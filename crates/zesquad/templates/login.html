{% extends "base.html" %}
{% block title %}Log in · zesquad{% endblock %}
{% block content %}
<section class="intro">
  <h1>Log in</h1>
  <p>This site is private. Enter the password you were given.</p>
  <form method="post" action="/login" class="row">
    <input type="hidden" name="next" value="{{ next }}">
    <label class="grow">
      <span class="visually-hidden">Password</span>
      <input type="password" name="password" placeholder="Password" required autofocus autocomplete="current-password">
    </label>
    <button type="submit">Log in</button>
  </form>
  {% if wrong %}<p class="error" role="alert">That's not the password.</p>{% endif %}
</section>
{% endblock %}
