<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}zesquad{% endblock %}</title>
  {#- What a link preview (Discord, chat apps) shows. #}
  {%- block meta %}
  <meta name="description" content="Friend squads for WoW: Forever: the characters you play with, with their Armory details.">
  <meta property="og:title" content="zesquad">
  <meta property="og:description" content="Friend squads for WoW: Forever: the characters you play with, with their Armory details.">
  {%- endblock %}
  <meta property="og:site_name" content="zesquad">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15140f" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="{{ crate::assets::base() }}/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="{{ crate::assets::base() }}/style.css">
  <script src="{{ crate::assets::base() }}/htmx-2.0.11.min.js" defer></script>
</head>
<body>
  <header class="site">
    <a href="/" class="brand">zesquad</a>
    <span class="tagline">friend squads for WoW: Forever</span>
    <nav class="site-nav"><a href="/auctions">Auction house</a></nav>
    {%- if logout %}
    <form method="post" action="/logout" class="logout"><button type="submit" class="quiet">Log out</button></form>
    {%- endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
