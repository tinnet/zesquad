{% extends "base.html" %}
{% block title %}{{ squad.name }} · zesquad{% endblock %}
{% block content %}
<section class="squad-head">
  <form method="post" action="{{ roster.base() }}/name" class="rename">
    <label>
      <span class="visually-hidden">Squad name</span>
      <input name="name" value="{{ squad.name }}" required maxlength="64" class="squad-name" aria-label="Squad name">
    </label>
    <button type="submit" class="quiet">Rename</button>
  </form>
  <div class="share row">
    <label class="grow">
      <span class="visually-hidden">Squad link</span>
      <input id="squad-link" value="{{ link }}" readonly>
    </label>
    <button type="button" class="quiet" data-copy="squad-link" hidden>Copy link</button>
  </div>
  <p class="hint">Characters from {{ squad.region.name() }}. Share this link with your squad: anyone who has it can see and edit the squad.</p>
</section>
<script src="{{ crate::assets::base() }}/share.js" defer></script>
{% include "roster.html" %}
{% endblock %}
