[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# The real version comes from the release tag (CalVer); see docs/development.md.
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/tinnet/zesquad"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
# Thin rather than full LTO: rebuilding our crates on top of cached dependencies takes ~25s
# instead of ~80s (16 cores; CI's 4 are slower), for a binary ~20% larger (16.4 MB, not 13.8).
lto = "thin"
strip = true
