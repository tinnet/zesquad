name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: pull requests from forks run this too.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.7 # rust, just from mise.toml
      # Dependencies built before, keyed by the toolchain and Cargo.lock (see docs/development.md).
      - uses: actions/cache/restore@v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'Cargo.toml', 'Cargo.lock') }}
          restore-keys: cargo-test-${{ runner.os }}-${{ runner.arch }}-
      - run: just ci
      # Only main saves; pull requests and tags read main's caches. Our own crates are left out:
      # they're rebuilt every time anyway.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        run: cargo clean -p zesquad -p zesquad-core
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # Every action is pinned to a commit in actions.lock; fail if a workflow uses one that isn't.
  actions-lock:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify

  # The static Linux binary the release ships, built and started once.
  linux:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # shadow-rs reads the tags for the version
          persist-credentials: false
      - run: sudo apt-get install -y --no-install-recommends musl-tools
      - uses: jdx/mise-action@v5.2.7
        with:
          install_args: rust
      # The same key as release.yml's build, which restores what this saves.
      - uses: actions/cache/restore@v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-release-${{ matrix.target }}-${{ hashFiles('mise.toml', 'Cargo.toml', 'Cargo.lock') }}
          restore-keys: cargo-release-${{ matrix.target }}-
      - run: cargo build --release --locked --target ${{ matrix.target }} -p zesquad
      # No version check here; tests/cli.rs checks -V and --version agree, and release.yml checks
      # the version against the tag.
      - name: Smoke test
        run: .github/scripts/smoke-test.sh target/${{ matrix.target }}/release/zesquad
      # After the smoke test: cleaning removes the binary it runs.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        run: cargo clean --release --target ${{ matrix.target }} -p zesquad -p zesquad-core
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}
